<svg xmlns="http://www.w3.org/2000/svg" width="620" height="122" viewBox="0 0 620 122"><rect width="620" height="122" fill="white"/><g font-family="Arial,sans-serif" fill="#202d32"><text x="0" y="15" font-size="13">HSV-Beispiel: H = 0° (Rot), V = 80 %; nur S verändert sich</text><rect x="0" y="28" width="116" height="54" fill="#cccccc"/><text x="58" y="102" font-size="13" text-anchor="middle">S = 0 %</text><rect x="125" y="28" width="116" height="54" fill="#cc9999"/><text x="183" y="102" font-size="13" text-anchor="middle">S = 25 %</text><rect x="250" y="28" width="116" height="54" fill="#cc6666"/><text x="308" y="102" font-size="13" text-anchor="middle">S = 50 %</text><rect x="375" y="28" width="116" height="54" fill="#cc3333"/><text x="433" y="102" font-size="13" text-anchor="middle">S = 75 %</text><rect x="500" y="28" width="116" height="54" fill="#cc0000"/><text x="558" y="102" font-size="13" text-anchor="middle">S = 100 %</text></g></svg>
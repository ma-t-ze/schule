name: Deploy to Web Space

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4  # Aktuelle Version, v2 ist veraltet

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SECRET_SSH }}" | base64 -d > ~/.ssh/id_ed25519  # Base64-Dekodierung ist wichtig!
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -t ed25519 ssh.strato.de >> ~/.ssh/known_hosts  # Host-Key automatisch akzeptieren

    - name: Test SSH Connection
      run: |
        ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no matthiasheckel.com@ssh.strato.de exit

    - name: Deploy to Web Space
      run: |
        rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519" ./dist/ matthiasheckel.com@ssh.strato.de:visualizer/
